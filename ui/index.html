      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;

      padding-left: 28px;

      position: absolute;
      left: 11px;
      top: 10px;
      bottom: 18px;
      width: 2px;
      background: #d5dde8;
    }

      position: relative;
      margin-bottom: 22px;
    }

      content: "";
      position: absolute;
      left: -23px;
      top: 5px;

      height: 12px;

    .card .k {

      border-color: #b7e4c7;

      border-color: #f0d08a;
      color: var(--warn);

    .card.bad {

      border-color: #f3b4bc;

      border-color: #bfd4f6;

    const m = DATA.metrics || {};

    function fmt(n) { return Number(n || 0).toLocaleString("en-IN"); }
    function rupee(n) { return "₹" + Number(n || 0).toFixed(2); }
    function sec(n) { return Number(n || 0).toFixed(1) + "s"; }
    function drop(pct) { return pct == null ? "—" : "−" + pct + "%"; }
    function esc(v) {
      return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function pretty(s) { return String(s || "").replace(/_/g, " "); }
    function memoryUsed(row) {
      const t = row.trace || {};
      return Boolean(row.recalled || row.skipped_queries || t.memory_verify);
    }

    document.getElementById("metrics").innerHTML = [
      metric("tokens", "Tokens", drop(m.token_drop_pct), fmt(m.q01_tokens) + " → " + fmt(m.q06_tokens)),
      metric("cost", "Cost", drop(m.cost_drop_pct), rupee(m.q01_cost_inr) + " → " + rupee(m.q06_cost_inr)),
      metric("time", "Time", drop(m.time_drop_pct), sec(m.q01_seconds) + " → " + sec(m.q06_seconds)),
    ].join("");

    function metric(kind, label, value, note) {
      return '<article class="metric ' + kind + '"><div class="label">' + label +
        '</div><div class="value">' + esc(value) + '</div><div class="note">' + esc(note) + "</div></article>";
    }

    const tbody = document.getElementById("rows");
    DATA.questions.forEach((row) => {
      const tr = document.createElement("tr");
      tr.id = row.qid.toLowerCase();
      tr.tabIndex = 0;
      tr.setAttribute("role", "button");
      const status = !row.present ? pill("warn", "missing")
        : row.complete ? pill("ok", "complete")
        : pill("warn", "incomplete");
      const memory = memoryUsed(row) ? pill("ok", "used") : pill("muted", "—");
      const auditor = row.unsupported ? pill("bad", row.unsupported + " UNSUPPORTED")
        : row.supported ? pill("ok", row.supported + " SUPPORTED")
        : pill("muted", "—");
      tr.innerHTML =
        '<td class="qid">' + esc(row.qid) + "</td>" +
        '<td><span class="qtext" title="' + esc(row.question) + '">' + esc(row.question) + "</span></td>" +
        "<td>" + status + "</td>" +
        "<td>" + memory + "</td>" +
        '<td class="num">' + (row.present ? fmt(row.tokens) : "—") + "</td>" +
        '<td class="num">' + (row.present ? sec(row.wall_seconds) : "—") + "</td>" +
        '<td class="num">' + (row.present ? rupee(row.cost_inr) : "—") + "</td>" +
        "<td>" + auditor + "</td>";
      tr.addEventListener("click", () => openRow(row, tr));
      tr.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openRow(row, tr); }
      });
      tbody.appendChild(tr);
    });

    function pill(kind, text) {
      return '<span class="pill ' + kind + '">' + esc(text) + "</span>";
    }

    function openRow(row, tr) {
      document.querySelectorAll("tbody tr").forEach((el) => el.classList.remove("active"));
      tr.classList.add("active");
      const el = document.getElementById("drawer");
      el.classList.add("open");
      el.innerHTML =
        '<div class="drawer-head"><div><h2>' + esc(row.qid) + "</h2><p>" + esc(row.question) +
        "</p></div><button class=\"close\" id=\"closeDrawer\">Close</button></div>" +
        '<div class="ladder">' +
          rung("Specify", specifyCards(row)) +
          rung("Memory", memoryCards(row)) +
          rung("Search", searchCards(row)) +
          rung("Pages", pagesCards(row)) +
          rung("Analyst", analystCards(row)) +
          rung("Cross Check", crossCheckCards(row)) +
          rung("Auditor", auditorCards(row)) +
          rung("Final Gate", gateCards(row)) +
        "</div>";
      document.getElementById("closeDrawer").addEventListener("click", () => {
        document.querySelectorAll("tbody tr").forEach((r) => r.classList.remove("active"));
        el.classList.remove("open");
        el.innerHTML = "";
      });
      el.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function rung(title, html) {
      return '<section class="rung"><h3>' + esc(title) + "</h3>" + html + "</section>";
    }

    function specifyCards(row) {
      const t = row.trace || {};
      return grid([
        ...((t.entities || []).map((x) => card("info", "Entity", x, ""))),
        ...((t.required_fields || []).map((x) => card("info", "Field", x, ""))),
      ], "No specification in this trace.");
    }
    function memoryCards(row) {
      const t = row.trace || {};
      return grid([
        card(t.memory_verify ? "ok" : (memoryUsed(row) ? "ok" : "warn"), "Path",
          t.memory_verify ? "Memory verify" : (memoryUsed(row) ? "Recalled, then searched" : "Full search"),
          t.memory_verify
            ? "Reopened stored URLs. No plan, search, or wave 2."
            : (memoryUsed(row) ? (row.recalled || 0) + " recalled · " + (row.skipped_queries || 0) + " queries skipped" : "Required fields were not all known.")),
        ...(t.known_fields || []).slice(0, 6).map((x) => card("ok", "Known field", x, "")),
        ...(t.stored_urls || []).map((u) => card("info", "Stored URL", host(u), u)),
      ], "No memory event.");
    }
    function searchCards(row) {
      const t = row.trace || {};
      return grid((t.queries || []).map((q) => card("info", (q.targets || []).join(", ") || "Query", q.query, "")), "No live search (memory verify).");
    }
    function pagesCards(row) {
      const t = row.trace || {};
      const extra = (t.pages_used != null)
        ? [card("info", "Budget", t.pages_used + " pages", (t.passages_selected || 0) + " passages")]
        : [];
      const fetches = (t.fetches || []).map((f) => card(f.ok ? "ok" : "bad", f.ok ? "Fetched" : "Failed", f.title || host(f.url), f.url));
      return grid(extra.concat(fetches), "No pages fetched.");
    }
    function analystCards(row) {
      const t = row.trace || {};
      const cards = (t.claims || []).map((c) => card("info", c.claim_id + " · " + c.field, c.text, ""));
      (t.unanswered || []).forEach((u) => cards.push(card("warn", "Unanswered", u.field, u.reason)));
      if (t.planted) cards.push(card("bad", "Planted " + t.planted.claim_id, t.planted.text, "False claim injected for the auditor."));
      return grid(cards, "No analyst claims.");
    }
    function crossCheckCards(row) {
      const t = row.trace || {};
      const cards = [];
      if (t.cross_check_skipped) {
        cards.push(card("warn", "Path", "Skipped independent search", "Memory verify: no second-source search."));
      }
      (t.cross_check || []).forEach((v) => {
        const kind = v.status === "corroborated" ? "ok"
          : v.status === "conflicting" ? "bad"
          : v.status === "skipped_multi_source" ? "info"
          : "warn";
        const more = [host(v.independent_url), v.evidence_origin && v.evidence_origin !== "none" ? v.evidence_origin : ""]
          .filter(Boolean).join(" · ");
        cards.push(card(kind, v.claim_id + " · " + v.status, v.reason || v.status, more));
      });
      return grid(cards, "No cross-check in this trace.");
    }
    function auditorCards(row) {
      const t = row.trace || {};
      return grid((t.auditor || []).map((a) => {
        const kind = a.verdict === "SUPPORTED" ? "ok" : a.verdict === "UNSUPPORTED" ? "bad" : "warn";
        return card(kind, a.claim_id + " · " + a.verdict, a.reason || a.verdict, "");
      }), "No auditor verdicts.");
    }
    function gateCards(row) {
      const t = row.trace || {};
      const cards = (t.accepted || []).map((a) => card("ok", a.field, a.text, (a.sources || []).join(" · ")));
      (t.missing || []).forEach((miss) => cards.push(card("warn", "Missing · " + miss.field, miss.reason || "unanswered", "")));
      if (row.qid === "Q01" && DATA.naive && DATA.naive.answer) {
        cards.push(card("warn", "Naive one-shot", DATA.naive.answer, rupee(DATA.naive.cost_inr) + " · " + sec(DATA.naive.wall_seconds)));
      }
      return grid(cards, "Gate kept nothing.");
    }

    function grid(cards, empty) {
      if (!cards || !cards.length) return '<p class="empty">' + esc(empty || "Nothing here.") + "</p>";
      return '<div class="cards">' + cards.join("") + "</div>";
    }
    function card(cls, k, t, more) {
      return '<article class="card ' + cls + '"><div class="k">' + esc(pretty(k)) + '</div><div class="t">' +
        esc(t) + "</div>" + (more ? '<div class="m">' + esc(more) + "</div>" : "") + "</article>";
    }
    function host(url) {
      try { return new URL(url).host; } catch (e) { return url; }
    }
  </script>
